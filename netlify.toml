[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# SPA fallback — all routes serve index.html so React Router handles navigation
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# ──────────────────────────────────────────────────────────────
# Required environment variables — set these in the Netlify UI:
#   Site → Site configuration → Environment variables
#
#   VITE_API_BASE_URL  =  https://your-backend.onrender.com
#
# Without this, all API calls fall back to relative /api paths
# which 404 on Netlify's static hosting.
# ──────────────────────────────────────────────────────────────
